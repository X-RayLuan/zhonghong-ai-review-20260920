 const slides=[{"title": "如何用AI知识库与Agent，构建销售增长飞轮", "body": "\u003ccanvas class=\"ascii-bg\" aria-hidden=\"true\">\u003c/canvas>\u003cdiv data-anim=\"kicker\" class=\"t-meta\" style=\"color:white\">中宏宏行现场总结会 · 60分钟\u003c/div>\u003cdiv style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:4vh\">\u003ch1 data-anim=\"title\" style=\"font-size:min(5.2vw,9.26vh);font-weight:200;line-height:1.3\">如何用AI知识库与Agent，\u003cbr>构建\u003cspan style=\"font-style:italic;font-weight:300\">销售增长飞轮\u003c/span>\u003c/h1>\u003cp data-anim=\"lead\" style=\"font-size:min(2.2vw,3.92vh)\">行动学习复盘与机构负责人带教\u003c/p>\u003c/div>\u003cdiv data-anim=\"bottom\" style=\"border-top:1px solid #ffffff66;padding-top:3vh;font-size:max(16px,1.15vw)\">数据核验 2026.09.22　　修订版 2026.09.22\u003c/div>", "theme": "accent hero dark", "layout": "SWISS-COVER-ASCII", "note": "60分钟建议：第1–9页复盘与自愿分享20分钟，第10–17页业务流与企业知识20分钟，第18–27页个人构建与团队学习15分钟，第28页交流5分钟。前段只讲核心数据与两个团队协作过程。技术、原始提示词及其余案例见可点击参考页。北京时间2026-09-22 01:17重新读取4个正式群和10个已知私聊；机器人群列表与9月18日起接收日志未发现新增会话。个险最新消息09-18 21:49，银保09-20 09:39。未接入入口和未采集私聊无法排除。沿用9月19日人工业务编码，新增银保整合PPT请求1次/1轮；转发附件及机器人3条输出不计业务轮次。按渠道内账号去重，不是已核实名册人数；排除支持人员、王磊和张娜、机器人、附件、问候、仅@、重试与下载求助。分享自愿，人选须本人确认。\n完整参考：../index.html#1"}, {"title": "现场主线与会后参考", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">现场主线与会后参考\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv class=\"sub-grid-3-2\" data-anim=\"up\" style=\"margin-top:0;gap:20px\">\u003ca href=\"#4\" class=\"card-fill\" style=\"display:flex;flex-direction:column;gap:18px;padding:24px;text-decoration:none\">\u003cspan style=\"font-size:16px;color:var(--accent)\">01 / 20分钟\u003c/span>\u003ch3 style=\"font-size:26px;font-weight:400\">学习复盘\u003c/h3>\u003cp style=\"font-size:18px;line-height:1.5\">核心数据、两个案例与自愿分享\u003c/p>\u003c/a>\u003ca href=\"#10\" class=\"card-fill\" style=\"display:flex;flex-direction:column;gap:18px;padding:24px;text-decoration:none\">\u003cspan style=\"font-size:16px;color:var(--accent)\">02 / 20分钟\u003c/span>\u003ch3 style=\"font-size:26px;font-weight:400\">Agent与企业知识\u003c/h3>\u003cp style=\"font-size:18px;line-height:1.5\">业务流、Ontology与控制层\u003c/p>\u003c/a>\u003ca href=\"#18\" class=\"card-fill\" style=\"display:flex;flex-direction:column;gap:18px;padding:24px;text-decoration:none\">\u003cspan style=\"font-size:16px;color:var(--accent)\">03 / 20分钟\u003c/span>\u003ch3 style=\"font-size:26px;font-weight:400\">个人实践与团队学习\u003c/h3>\u003cp style=\"font-size:18px;line-height:1.5\">构建、共创、验收与交流\u003c/p>\u003c/a>\u003ca href=\"references.html\" class=\"card-fill\" style=\"display:flex;flex-direction:column;gap:18px;padding:24px;text-decoration:none\">\u003cspan style=\"font-size:16px;color:var(--accent)\">会后参考\u003c/span>\u003ch3 style=\"font-size:26px;font-weight:400\">差异补充27页\u003c/h3>\u003cp style=\"font-size:18px;line-height:1.5\">统计、四案例原话与技术细节\u003c/p>\u003c/a>\u003ca href=\"agent-reference.html#onepage\" class=\"card-fill\" style=\"display:flex;flex-direction:column;gap:18px;padding:24px;text-decoration:none\">\u003cspan style=\"font-size:16px;color:var(--accent)\">提示词附件\u003c/span>\u003ch3 style=\"font-size:26px;font-weight:400\">个险Agent示例\u003c/h3>\u003cp style=\"font-size:18px;line-height:1.5\">完整提示词与可溯源规则\u003c/p>\u003c/a>\u003ca href=\"../index.html#46\" class=\"card-fill\" style=\"display:flex;flex-direction:column;gap:18px;padding:24px;text-decoration:none\">\u003cspan style=\"font-size:16px;color:var(--accent)\">实操附件\u003c/span>\u003ch3 style=\"font-size:26px;font-weight:400\">代理人带教路径\u003c/h3>\u003cp style=\"font-size:18px;line-height:1.5\">70分钟共创练习及团队周会\u003c/p>\u003c/a>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);line-height:1.5\">主讲28页＋差异附录27页；完整版55页独立保留，原始提示词可点击查阅。\u003c/p>", "theme": "light", "layout": "S16", "note": "采用三段主线而非六块平铺。时间为建议分配，不含后续活动。附录仅收录55页中未进入主讲的27页，不重复主讲页；精简页的完整细节链接到独立55页版。\n完整参考：../index.html#2"}, {"title": "增长飞轮与人的位置", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">增长飞轮与人的位置\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:4fr 6fr;gap:4vw;align-items:center\">\u003cdiv style=\"display:grid;gap:2.8vh\">\u003cdiv style=\"display:flex;gap:1.6vw;align-items:baseline\">\u003cspan class=\"t-meta\" style=\"color:inherit\">01\u003c/span>\u003cdiv style=\"font-size:min(2.05vw,3.6489999999999996vh);font-weight:300;line-height:1.22\">哪些经验值得分享\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;gap:1.6vw;align-items:baseline\">\u003cspan class=\"t-meta\" style=\"color:inherit\">02\u003c/span>\u003cdiv style=\"font-size:min(2.05vw,3.6489999999999996vh);font-weight:300;line-height:1.22\">低频使用有哪些情境\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;gap:1.6vw;align-items:baseline\">\u003cspan class=\"t-meta\" style=\"color:inherit\">03\u003c/span>\u003cdiv style=\"font-size:min(2.05vw,3.6489999999999996vh);font-weight:300;line-height:1.22\">哪些任务适合尝试\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;gap:1.6vw;align-items:baseline\">\u003cspan class=\"t-meta\" style=\"color:inherit\">04\u003c/span>\u003cdiv style=\"font-size:min(2.05vw,3.6489999999999996vh);font-weight:300;line-height:1.22\">怎样验证业务价值\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"position:relative;height:44vh\">\u003csvg viewBox=\"0 0 600 360\" style=\"width:100%;height:100%;color:var(--accent)\" aria-hidden=\"true\">\u003cpath d=\"M145 60H455V300H145Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"m288 53 14 7-14 7m160 106 7 14 7-14m-150 134-14-7 14-7m-160-106-7-14-7 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003c/svg>\u003cdiv style=\"position:absolute;left:24%;top:16%;transform:translate(-50%,-50%);background:var(--paper);padding:1vh 1vw;white-space:nowrap;font-size:min(1.9vw,3.39vh)\">企业知识\u003c/div>\u003cdiv style=\"position:absolute;left:76%;top:16%;transform:translate(-50%,-50%);background:var(--paper);padding:1vh 1vw;white-space:nowrap;font-size:min(1.9vw,3.39vh)\">Agent\u003c/div>\u003cdiv style=\"position:absolute;left:76%;top:83%;transform:translate(-50%,-50%);background:var(--paper);padding:1vh 1vw;white-space:nowrap;font-size:min(1.9vw,3.39vh)\">销售行动\u003c/div>\u003cdiv style=\"position:absolute;left:24%;top:83%;transform:translate(-50%,-50%);background:var(--paper);padding:1vh 1vw;white-space:nowrap;font-size:min(1.9vw,3.39vh)\">反馈与更新\u003c/div>\u003cdiv style=\"position:absolute;inset:32% 34%;font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.45;text-align:left\">人的判断\u003cbr>关系与领导力\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">已有可复制的协作行为，业务增长仍待验证\u003c/p>", "theme": "light", "layout": "S14", "note": "2分钟含封面。承接上午讨论：哪些问题可由AI放大或重新解决？哪些仍依赖人的判断、关系和领导力？\n完整参考：../index.html#3"}, {"title": "群聊与私聊：最新业务使用", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">群聊与私聊：最新业务使用\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;border-top:2px solid var(--accent);padding-top:4vh\">\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">个险 / 3个群\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">10个业务账号\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">37次提问／指令\u003cbr>52轮业务互动\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">个险 / 10个私聊\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">10个业务账号\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">42次提问／指令\u003cbr>64轮业务互动\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">银保 / 1个群\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">5个业务账号\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">14次提问／指令\u003cbr>16轮业务互动\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);line-height:1.5\">9月22日核验：私聊无新增；银保增加1次指令。个险群私聊去重共14个账号。\u003c/p>", "theme": "dark", "layout": "S05", "note": "北京时间2026-09-22 01:17重新读取4个正式群和10个已知私聊；机器人群列表与9月18日起接收日志未发现新增会话。个险最新消息09-18 21:49，银保09-20 09:39。未接入入口和未采集私聊无法排除。沿用9月19日人工业务编码，新增银保整合PPT请求1次/1轮；转发附件及机器人3条输出不计业务轮次。按渠道内账号去重，不是已核实名册人数；排除支持人员、王磊和张娜、机器人、附件、问候、仅@、重试与下载求助。\n4个正式群、10个已知私聊；按账号统计，非全员覆盖率。群聊与私聊账号有重叠；未接入入口不计。私聊原始输入155条。学员身份未全量核实，业务账号不等于已核实学员数。"}, {"title": "案例一：一起完善白板会议", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">案例一：一起完善白板会议\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;border-top:2px solid var(--accent);padding-top:4vh\">\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">11次提问\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">持续共创\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">补充主管、人手与时长约束\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">关键动作\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">请AI反问\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">以真实运作方式完善流程\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">团队产物\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">操作手册\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">把个人经验写成团队可讨论的做法\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);line-height:1.5\">已观察到共创过程；实际采用及效果待本人确认。 \u003ca href=\"references.html#6\">原始提问与过程 ↗\u003c/a>\u003c/p>", "theme": "light", "layout": "S05", "note": "个险匿名案例1。11次提问包含持续共创。日志显示提供模板、补充角色和时长、邀请AI提问。操作手册与工具是否实际采用尚待本人确认。\n现场讲关键动作，不以11次作为能力分数。团队贡献在于把现场经验带入流程设计。原始提示词保留于参考原第11页。\n完整参考：../index.html#10"}, {"title": "案例二：同伴协作推进报告交付", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">案例二：同伴协作推进报告交付\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;border-top:2px solid var(--accent);padding-top:4vh\">\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">2位成员\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">协同跟进\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">19日同伴追交付\u003cbr>20日继续整合两份PPT\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">关键动作\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">明确交付\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">从分析内容进一步确认可获取文件\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">团队产物\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">真实群文件\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">两日均核验群文件发送\u003cbr>下载与实际采用仍待确认\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);line-height:1.5\">团队价值：发现交付障碍后共同推进。 \u003ca href=\"references.html#11\">原始提问与时间线 ↗\u003c/a>\u003c/p>", "theme": "dark", "layout": "S05", "note": "9月19日13:30给数据；13:42补报告；13:49要求PPT；13:52下载受阻；14:03同伴追问；14:04发送真实群文件；14:05点赞。已核验本地报告与PPT及API发送记录。\n9月20日09:38同一业务账号进一步要求结合机构与人员能力整合两份PPT，09:39再次发送真实群文件。说明短期任务接续，不证明采用或经营效果。\n保留原案例4的完整过程与提示词于参考原第16–17页。现场编号二不改变来源案例编号。不能把发送成功说成业务采用或成交。\n完整参考：../index.html#16"}, {"title": "团队学习中的可观察行为", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">团队学习中的可观察行为\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:3vw;border-top:2px solid var(--accent);padding-top:4vh\">\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:3vh\">\u003cspan class=\"t-meta\" style=\"color:inherit\">01\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.717vh);font-weight:300;line-height:1.22\">背景\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">材料＋场景＋约束\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">检查读取与版本\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:3vh\">\u003cspan class=\"t-meta\" style=\"color:inherit\">02\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.717vh);font-weight:300;line-height:1.22\">收敛\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">追问＋目标＋取舍\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">检查任务完成度\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:3vh\">\u003cspan class=\"t-meta\" style=\"color:inherit\">03\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.717vh);font-weight:300;line-height:1.22\">纠偏\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">出处＋假设＋权限\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">检查建议是否越界\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:3vh\">\u003cspan class=\"t-meta\" style=\"color:inherit\">04\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.717vh);font-weight:300;line-height:1.22\">交付\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">产物＋格式＋验收\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">检查采用与反馈\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">教学观察：如何提供背景、共同核验、推进任务；不是正式评分表。\u003c/p>", "theme": "hero dark", "layout": "S19", "note": "这些维度可用于教学观察，不是已完成的能力评分。当前缺乏统一评分、名册与采用反馈。\n完整参考：../index.html#18"}, {"title": "使用中的支持需求与证据边界", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">使用中的支持需求与证据边界\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv class=\"duo-compare\" data-anim=\"up\" style=\"margin-top:0;flex:0 0 auto;min-height:38vh\">\u003cdiv class=\"col\" data-anim=\"left\">\u003cspan class=\"t-cat\" style=\"color:inherit\">产品证据\u003c/span>\u003cdiv style=\"font-size:min(3.6vw,6.408vh);font-weight:300;line-height:1.22\">入口与交付需支持\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:2.5vh;margin-top:2vh\">\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">开通前输入未获回复\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">机构材料不可读／文件交付失败\u003c/p>\u003c/div>\u003c/div>\u003cspan class=\"vrule\">\u003c/span>\u003cdiv class=\"col\" data-anim=\"right\">\u003cspan class=\"t-cat\" style=\"color:inherit\">效果证据\u003c/span>\u003cdiv style=\"font-size:min(3.6vw,6.408vh);font-weight:300;line-height:1.22\">采用反馈仍待补充\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:2.5vh;margin-top:2vh\">\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">缺少经本人确认的采用反馈\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">没有已核实的签单或节时归因\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">区分工具、资料与流程问题，再共同讨论需要哪些支持。\u003c/p>", "theme": "dark", "layout": "S08", "note": "障碍有历史证据，是否仍存在或已全部修复需逐项核验。不能将有障碍等同于没用起来，有些成员一直在尝试。\n完整参考：../index.html#20"}, {"title": "机构负责人自述：一个真实过程", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">机构负责人自述：一个真实过程\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:3vw;border-top:2px solid var(--accent);padding-top:4vh\">\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:3vh\">\u003cspan class=\"t-meta\" style=\"color:inherit\">01\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.717vh);font-weight:300;line-height:1.22\">遇到什么\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">一个具体业务问题\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:3vh\">\u003cspan class=\"t-meta\" style=\"color:inherit\">02\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.717vh);font-weight:300;line-height:1.22\">怎样使用\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">关键追问或纠偏\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:3vh\">\u003cspan class=\"t-meta\" style=\"color:inherit\">03\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.717vh);font-weight:300;line-height:1.22\">实际采用\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">用了哪一段产物\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:3vh\">\u003cspan class=\"t-meta\" style=\"color:inherit\">04\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.717vh);font-weight:300;line-height:1.22\">需要什么支持\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">一个未解决的问题\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">自愿分享：4分钟讲过程＋1分钟共同提炼；未确认人选时回看匿名案例。\u003c/p>", "theme": "hero light", "layout": "S19", "note": "本人4分钟、主持1分钟。人选与结果待核实；无人确认时，复用匿名案例2或4。不补写虚构发言或成交故事。\n完整参考：../index.html#24"}, {"title": "两种使用方式：是否嵌入业务流", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">两种使用方式：是否嵌入业务流\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv class=\"duo-compare\" data-anim=\"up\" style=\"margin-top:0;flex:0 0 auto;min-height:38vh\">\u003cdiv class=\"col\" data-anim=\"left\">\u003cspan class=\"t-cat\" style=\"color:inherit\">未嵌入业务流 · 微软销售教练\u003c/span>\u003cdiv style=\"font-size:min(3.6vw,6.408vh);font-weight:300;line-height:1.22\">独立练习与反馈\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:2.5vh;margin-top:2vh\">\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">按行业、方案与难度模拟客户\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">评估沟通、需求识别与产品知识\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">人主动进入；标准化情境可重复练习\u003c/p>\u003c/div>\u003c/div>\u003cspan class=\"vrule\">\u003c/span>\u003cdiv class=\"col\" data-anim=\"right\">\u003cspan class=\"t-cat\" style=\"color:inherit\">嵌入业务流 · Salesforce销售Agent\u003c/span>\u003cdiv style=\"font-size:min(3.6vw,6.408vh);font-weight:300;line-height:1.22\">连接资料与业务动作\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:2.5vh;margin-top:2vh\">\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">结合CRM资料生成会前简报\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">支持线索沟通与下一步行动\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">在工作节点触发；按权限形成跟进行动\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">教学比较维度，并非产品的绝对分类；标准化与持续改进，两种方式都需要。\u003c/p>", "theme": "dark", "layout": "S08", "note": "微软Sales Coach案例依据项目开发负责人的一手项目说明：为微软销售人员设计的概念验证应用（PoC），支持情景模拟与沟通、BANT、产品知识反馈；不将PoC说成已全面商用产品。微软官方另披露Agent P为合作伙伴提供基于微软内容的情景式销售教练，不能混称同一产品。\nhttps://wfry.net/portfolio/project_2024salescoach.htm\nhttps://partner.microsoft.com/en-us/blog/article/mcaps-start-for-partners-2026\nSalesforce Agentforce官方产品资料支持客户研究、会议准备、线索互动、下一步与商机更新。保险适配需授权、审核与合规，不证明中宏已经部署或提升成交。\nhttps://www.salesforce.com/sales/ai-sales-agent/\n讲法衔接：微软把单次问答变成模拟练习与反馈；Salesforce把产物连接到客户准备和后续行动。可迁移的是机制，不能直接迁移效果。\n按会议要求改以是否嵌入业务流讲述。微软独立模拟为未嵌入真实业务操作的示例，不断言微软所有产品均独立；Salesforce为CRM业务流示例。是否嵌入与是否可进化是不同维度，两者都需要固定规则、验证与反馈。选型看任务频率、资料权限、行动风险及维护条件。\n完整参考：../index.html#22"}, {"title": "Agentify医疗销售教练：拜访闭环", "body": "\u003cfigure data-anim=\"up\" style=\"flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:0\">\u003cimg src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABcsAAANFCAYAAACk/qREAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFiUAABYlAUlSJPAAAP+lSURBVHhe7N0FgBNn1wXgixV3ikNxd3enWCnu7m7FoRQr7u7uTqHF3d29uH64W7Ev592Z3UkyyWYNls15vn9+diay2WRmtnveO/cN9vjJ0y8iweTLly9qkWDBRF/Hl2qbov9rD4/Qed3fi+WZta+IiIiIiIiIiIiIiFwTzCp99hBMZdgenCfPHvfDc+B+Ho+zfKWyb8tWfV0T7NFjhOXY5BGQ4/HqKbTQ+8uXz+pfWx7fBo/zejIwycqJiIiIiIiIiIiIiPyFIStX9EDdUTQdLFhwFYzjdnUfy/9TYbn2CP35gj169OTLF6zpz6S+tKx8QaW5ts0C9zdWjVtVkGtPZlZV7grj47SnIiIiIiIiIiIiIqIgyJgie1R3+4zVY4 ,4.72vh);font-weight:300;line-height:1.25\">知识如何关联\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">岗位、指标、制度、案例\u003cbr>连接适用对象、版本与生效时间\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">Honeycomb / 控制层\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">行动如何受控\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">谁能看什么、能调用什么\u003cbr>何时请人确认、如何留痕与回退\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">一个带教问题\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">按关系找依据\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">先确认岗位与考核期\u003cbr>再查有效制度，由负责人作判断\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);line-height:1.5\">RAG只需记住：查相关依据再回答。此处为架构讲解，非已上线能力清单。\u003c/p>", "theme": "light", "layout": "S05", "note": "会议强调Ontology及控制层，RAG不展开技术实现。Honeycomb沿用会议纪要用词，纪要由AI生成，其具体产品定义与已部署功能尚待核实；此页仅用通用控制职责解释，不能视为中宏已部署Honeycomb。例子为教学情境，不含任何真实晋升结论。\n完整参考：../index.html#25"}, {"title": "中宏 Agent 产品架构", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(3.4vw,6vh);font-weight:400;line-height:1.25;color:#172a45;margin:0;flex-shrink:0\">中宏 Agent 产品架构\u003c/h2>\u003cdiv data-anim=\"up\" style=\"flex:1;display:flex;flex-direction:column;justify-content:center;color:#172a45;min-height:0;font-size:18px;line-height:1.4\">\u003cdiv style=\"display:grid;grid-template-columns:1fr 74px;align-items:stretch;gap:0\">\n \u003cdiv>\u003cdiv style=\"display:grid;grid-template-columns:110px 1fr;gap:14px;border-left:6px solid #2d71b8;background:#eaf3ff;padding:5px 12px;align-items:center\">\u003cb style=\"color:#2d71b8;font-size:18px\">触点层\u003c/b>\u003cdiv style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\u003cdiv style=\"border:1px solid #2d71b8;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">飞书群聊 / 私聊\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">当前业务入口\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #2d71b8;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">企业微信 / 钉钉\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">按授权接入\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #2d71b8;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">Web / 机构负责人工作台\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">汇报 / 复盘 / 带教\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"height:12px;text-align:center;font-size:18px;line-height:12px;color:#70869d\">↓\u003c/div>\n \u003cdiv style=\"display:grid;grid-template-columns:110px 1fr;gap:14px;border-left:6px solid #7145c1;background:#f1edff;padding:5px 12px;align-items:center\">\u003cb style=\"color:#7145c1;font-size:18px\">Agent 层\u003c/b>\u003cdiv style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\u003cdiv style=\"border:1px solid #7145c1;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">个险 Agent\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">荣誉体系 · 基础管理 · 队伍建设\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #7145c1;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">银保 Agent\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">渠道经营 · 人员能力 · 经营汇报\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #7145c1;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">代理人共创 Agent\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">训练场景示例，待验证与发布\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"height:12px;text-align:center;font-size:18px;line-height:12px;color:#70869d\">↓\u003c/div>\n \u003cdiv style=\"display:grid;grid-template-columns:110px 1fr;gap:14px;border-left:6px solid #257f80;background:#e8f5f3;padding:5px 12px;align-items:center\">\u003cb style=\"color:#257f80;font-size:18px\">Skill 层\u003c/b>\u003cdiv style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\">\u003cdiv style=\"border:1px solid #257f80;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">业务任务\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">制度速查 / 分析 / 报告\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #257f80;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">Office Hours\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">先澄清，一次追问一个问题\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #257f80;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">CEO Review\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">比较路径，收敛决策\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #257f80;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">销售练习\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">异议话术 / 素材草稿\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"height:12px;text-align:center;font-size:18px;line-height:12px;color:#70869d\">↓\u003c/div>\n \u003cdiv style=\"display:grid;grid-template-columns:110px 1fr;gap:14px;border-left:6px solid #d68a20;background:#fff4df;padding:5px 12px;align-items:center\">\u003cb style=\"color:#d68a20;font-size:18px\">ABrain\u003cbr>企业大脑\u003c/b>\u003cdiv style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\">\u003cdiv style=\"border:1px solid #d68a20;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">多模态输入\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">获准文档 · 表格 · 纪要\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #d68a20;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">Ontology 本体\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">岗位 · 指标 · 制度 · 案例\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #d68a20;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">LLM Wiki + RAG\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">结构化页面 · 可追溯引用\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #d68a20;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">长期记忆 + 更新\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">已确认背景 · 审核回写\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"height:12px;text-align:center;font-size:18px;line-height:12px;color:#70869d\">↓\u003c/div>\n \u003cdiv style=\"display:grid;grid-template-columns:110px 1fr;gap:14px;border-left:6px solid #172a45;background:#edf1f6;padding:5px 12px;align-items:center\">\u003cb style=\"color:#172a45;font-size:18px\">模型与\u003cbr>执行环境\u003c/b>\u003cdiv style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\u003cdiv style=\"border:1px solid #172a45;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">可选大模型\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">海外 / 国内模型，按任务选型\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #172a45;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">AGENTIFY\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">统一接入 · 统一适配\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"border:1px solid #172a45;background:white;padding:5px 10px;min-width:0\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">Agent与自动化\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:2px\">按实际工具能力与权限执行\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n \u003cdiv style=\"position:relative;margin-top:100px;margin-bottom:107px;border:3px solid #d68a20;border-left:0\">\u003cdiv style=\"position:absolute;top:35%;left:5px;width:65px;color:#a96000;font-size:16px;font-weight:600;line-height:1.5;background:#f7f9fc\">知识回流\u003cbr>\u003cspan style=\"font-size:14px;font-weight:500\">结果反馈\u003cbr>审核更新\u003c/span>\u003c/div>\u003cspan style=\"position:absolute;bottom:-16px;left:-7px;color:#d68a20;font-size:27px\">◀\u003c/span>\u003c/div>\u003c/div>\n \u003cdiv style=\"margin-top:10px;border:1px dashed #c75050;background:#fff0f0;padding:6px 14px;display:flex;justify-content:space-between;font-size:16px;color:#923f3f\">\u003cb>治理护栏 / 控制层\u003c/b>\u003cspan>权限分层\u003c/span>\u003cspan>人在环中确认\u003c/span>\u003cspan>不自动作出成交 / 承保决策\u003c/span>\u003cspan>全程留痕\u003c/span>\u003c/div>\u003c/div>\u003cp style=\"font-size:16px;color:#52657d;line-height:1.5;margin-top:12px;flex-shrink:0\">中宏场景架构示意：新增入口及能力须经授权、适配与验收。\u003c/p>", "theme": "light", "layout": "S17", "note": "改编自用户提供《华亚企业大脑 · 产品方案与报价》P3。保留触点、Agent、Skill、ABrain、模型与执行环境及贯穿治理、知识回流关系。华亚财务分身、薪酬、外贸教练替换为中宏个险、银保及代理人共创教学场景。这是中宏场景架构示意，不等于所有组件已部署。\nhttps://kvbp4ddagl8.feishu.cn/slides/LbjQsTjxml3EERdvhvFcsa8Qnje\n完整参考：../index.html#26"}, {"title": "ABrain：自我学习与进化的企业知识库", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(3.4vw,6vh);font-weight:400;line-height:1.25;color:#172a45;margin:0;flex-shrink:0\">ABrain：自我学习与进化的企业知识库\u003c/h2>\u003cp style=\"font-size:18px;line-height:1.4;color:#52657d;margin:12px 0 20px;flex-shrink:0\">多模态输入、业务本体、检索调用与审核更新，形成持续维护的知识底座\u003c/p>\u003cdiv data-anim=\"up\" style=\"flex:1;display:flex;flex-direction:column;justify-content:center;color:#172a45;min-height:0;font-size:18px;line-height:1.4\">\u003cdiv style=\"display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr 24px 1fr;align-items:stretch\">\u003cdiv style=\"border:1px solid #2d71b8;background:white\">\u003cdiv style=\"background:#2d71b8;color:white;padding:14px 12px;font-size:18px;font-weight:600\">01 接得进\u003cdiv style=\"margin-top:5px;font-size:17px\">多模态输入\u003c/div>\u003c/div>\u003cdiv style=\"padding:18px 14px;display:flex;flex-direction:column;gap:23px\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">个人笔记\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">公司批准的存储方式\u003cbr>Markdown / 笔记，权限可控\u003c/div>\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">获准业务资料\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">制度、经营汇总、培训材料\u003cbr>按范围接入，不默认全量采集\u003c/div>\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">多模态\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">图像 · PDF · 表格 · 语音纪要\u003cbr>保留原文件与出处\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;justify-content:center;color:#7592af;font-size:30px\">→\u003c/div>\u003cdiv style=\"border:1px solid #7145c1;background:white\">\u003cdiv style=\"background:#7145c1;color:white;padding:14px 12px;font-size:18px;font-weight:600\">02 立得住\u003cdiv style=\"margin-top:5px;font-size:17px\">Ontology 本体\u003c/div>\u003c/div>\u003cdiv style=\"padding:18px 14px;display:flex;flex-direction:column;gap:23px\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">实体建模\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">岗位 · 指标 · 制度 · 动作 · 案例\u003c/div>\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">统一口径\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">定义术语、统计口径和适用范围\u003c/div>\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">关系与时间线\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">岗位、指标对应哪条规则\u003cbr>哪个版本、何时生效\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;justify-content:center;color:#7592af;font-size:30px\">→\u003c/div>\u003cdiv style=\"border:1px solid #257f80;background:white\">\u003cdiv style=\"background:#257f80;color:white;padding:14px 12px;font-size:18px;font-weight:600\">03 用得上\u003cdiv style=\"margin-top:5px;font-size:17px\">LLM Wiki + RAG\u003c/div>\u003c/div>\u003cdiv style=\"padding:18px 14px;display:flex;flex-direction:column;gap:23px\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">LLM Wiki\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">为模型可读的结构化页面\u003cbr>按业务任务组织\u003c/div>\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">检索相关依据\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">带来源、版本与适用范围\u003cbr>输出可追溯引用\u003c/div>\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">Agent 调用\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">个险 / 银保 Agent\u003cbr>在真实工作中按权限取用\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;justify-content:center;color:#7592af;font-size:30px\">→\u003c/div>\u003cdiv style=\"border:1px solid #d68a20;background:white\">\u003cdiv style=\"background:#d68a20;color:white;padding:14px 12px;font-size:18px;font-weight:600\">04 会进化\u003cdiv style=\"margin-top:5px;font-size:17px\">长期记忆 + 审核更新\u003c/div>\u003c/div>\u003cdiv style=\"padding:18px 14px;display:flex;flex-direction:column;gap:23px\">\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">长期记忆\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">经确认的持续背景\u003cbr>不随一次会话消失\u003c/div>\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">更新机制\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">结果回写 · 冲突检测\u003cbr>知识空白提醒\u003c/div>\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">保护机制\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">过期知识提示复核\u003cbr>审核、版本、回滚与复测\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"position:relative;height:76px;margin:0 5%;border:3px solid #d68a20;border-top:0\">\u003cspan style=\"position:absolute;left:-13px;top:-8px;color:#d68a20;font-size:27px;background:#f7f9fc;line-height:1\">▲\u003c/span>\u003cdiv style=\"position:absolute;bottom:-15px;left:12%;right:12%;text-align:center;background:#f7f9fc;color:#a96000;font-size:18px;font-weight:600;padding:0 12px\">每次使用与结果反馈 → 更新提议 → 人工审核 → 下一轮知识复用\u003c/div>\u003c/div>\u003c/div>\u003cp style=\"font-size:16px;color:#52657d;line-height:1.5;margin-top:20px;flex-shrink:0\">自我学习指经审核的知识更新，不等于模型自动训练；原始依据与待审草案分层管理。\u003c/p>", "theme": "light", "layout": "S17", "note": "改编自来源P5。原图四阶段为多模态输入、Ontology本体、LLM Wiki+RAG、长期记忆+自我进化。将华亚CRM、用友、阿里国际站等系统和客户/机型/供应商/项目关系改为中宏授权资料与管理关系。自我学习在本课件指经审核的知识更新，不是模型权重自动训练，也不把聊天无差别回灌。\nhttps://kvbp4ddagl8.feishu.cn/slides/LbjQsTjxml3EERdvhvFcsa8Qnje\n完整参考：../index.html#28"}, {"title": "知识飞轮：每次工作都留下可复用知识", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(3.4vw,6vh);font-weight:400;line-height:1.25;color:#172a45;margin:0;flex-shrink:0\">知识飞轮：每次工作都留下可复用知识\u003c/h2>\u003cp style=\"font-size:18px;line-height:1.4;color:#52657d;margin:12px 0 20px;flex-shrink:0\">工作事实进入知识体系，使用结果经过验证再回写\u003c/p>\u003cdiv data-anim=\"up\" style=\"flex:1;display:flex;flex-direction:column;justify-content:center;color:#172a45;min-height:0;font-size:18px;line-height:1.4\">\u003cdiv style=\"display:grid;grid-template-columns:repeat(5,1fr 20px) 1fr;align-items:stretch\">\u003cdiv style=\"border:1px solid #a5b7cc;border-top:5px solid #d68a20;background:white;padding:20px 12px;min-height:240px\">\u003cdiv style=\"font-size:28px;font-weight:400;color:#d68a20;margin-bottom:25px\">1\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">工作产生事实\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">经营复盘 · 主管带教\u003cbr>客户沟通 · 已获准材料\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;justify-content:center;color:#7592af;font-size:30px\">→\u003c/div>\u003cdiv style=\"border:1px solid #a5b7cc;border-top:5px solid #d68a20;background:white;padding:20px 12px;min-height:240px\">\u003cdiv style=\"font-size:28px;font-weight:400;color:#d68a20;margin-bottom:25px\">2\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">授权采集\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">文档 · 表格 · 纪要\u003cbr>筛选、脱敏、保留来源\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;justify-content:center;color:#7592af;font-size:30px\">→\u003c/div>\u003cdiv style=\"border:1px solid #a5b7cc;border-top:5px solid #d68a20;background:white;padding:20px 12px;min-height:240px\">\u003cdiv style=\"font-size:28px;font-weight:400;color:#d68a20;margin-bottom:25px\">3\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">沉淀长期记忆\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">岗位 · 指标 · 规则 · 案例\u003cbr>关系 · 时间线 · 统一口径\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;justify-content:center;color:#7592af;font-size:30px\">→\u003c/div>\u003cdiv style=\"border:1px solid #a5b7cc;border-top:5px solid #d68a20;background:white;padding:20px 12px;min-height:240px\">\u003cdiv style=\"font-size:28px;font-weight:400;color:#d68a20;margin-bottom:25px\">4\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">Agent 调用\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">个险 / 银保真实任务\u003cbr>按权限检索，带依据回答\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;justify-content:center;color:#7592af;font-size:30px\">→\u003c/div>\u003cdiv style=\"border:1px solid #a5b7cc;border-top:5px solid #d68a20;background:white;padding:20px 12px;min-height:240px\">\u003cdiv style=\"font-size:28px;font-weight:400;color:#d68a20;margin-bottom:25px\">5\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">产生结果与反馈\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">是否采用 · 哪里出错\u003cbr>任务是否推进 · 结果证据\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;justify-content:center;color:#7592af;font-size:30px\">→\u003c/div>\u003cdiv style=\"border:1px solid #a5b7cc;border-top:5px solid #d68a20;background:white;padding:20px 12px;min-height:240px\">\u003cdiv style=\"font-size:28px;font-weight:400;color:#d68a20;margin-bottom:25px\">6\u003c/div>\u003cdiv style=\"font-size:18px;line-height:1.3\">\u003cb style=\"font-size:18px;font-weight:600\">验证后写回\u003c/b>\u003cdiv style=\"font-size:16px;line-height:1.45;color:#52657d;margin-top:5px\">纠错原因 · 有效经验\u003cbr>负责人审核 · 版本复测\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"position:relative;height:76px;margin:0 5%;border:3px solid #d68a20;border-top:0\">\u003cspan style=\"position:absolute;left:-13px;top:-8px;color:#d68a20;font-size:27px;background:#f7f9fc;line-height:1\">▲\u003c/span>\u003cdiv style=\"position:absolute;bottom:-15px;left:12%;right:12%;text-align:center;background:#f7f9fc;color:#a96000;font-size:18px;font-weight:600;padding:0 12px\">新知识回到起点：让下一次工作有更准的依据、可复用的经验\u003c/div>\u003c/div>\u003cdiv style=\"margin-top:45px;padding:18px 22px;border-left:5px solid #d68a20;background:#fff1d9;font-size:20px;line-height:1.6\">飞轮的判断标准：系统有没有因为这次工作，为下一次留下经过验证、更好的知识？\u003c/div>\u003c/div>\u003cp style=\"font-size:16px;color:#52657d;line-height:1.5;margin-top:20px;flex-shrink:0\">采用、节时与业务效果均需实际证据验证，不把材料生成等同于业务增长。\u003c/p>", "theme": "light", "layout": "S17", "note": "改编自来源P6的六步：工作产生事实、自动采集、沉淀长期记忆、Agent调用、产生结果与反馈、验证后写回。中宏适配将自动采集限定为获准范围，增加人工审核与版本复测。业务结果是待采集证据，不是已证明的收益。\nhttps://kvbp4ddagl8.feishu.cn/slides/LbjQsTjxml3EERdvhvFcsa8Qnje\n完整参考：../index.html#29"}, {"title": "Agentify＋ABrain 与豆包的区别", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">Agentify＋ABrain 与豆包的区别\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv class=\"duo-compare\" data-anim=\"up\" style=\"margin-top:0;flex:0 0 auto;min-height:38vh\">\u003cdiv class=\"col\" data-anim=\"left\">\u003cspan class=\"t-cat\" style=\"color:inherit\">豆包 · 通用个人使用\u003c/span>\u003cdiv style=\"font-size:min(3.6vw,6.408vh);font-weight:300;line-height:1.22\">现成的通用能力\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:2.5vh;margin-top:2vh\">\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">问答、附件分析、创作与任务执行\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">个性化记忆：延续个人背景\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">企业制度与协作流程需另行配置\u003c/p>\u003c/div>\u003c/div>\u003cspan class=\"vrule\">\u003c/span>\u003cdiv class=\"col\" data-anim=\"right\">\u003cspan class=\"t-cat\" style=\"color:inherit\">Agentify Agent＋ABrain · 本方案\u003c/span>\u003cdiv style=\"font-size:min(3.6vw,6.408vh);font-weight:300;line-height:1.22\">围绕企业任务组织\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:2.5vh;margin-top:2vh\">\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">Agent：澄清、检索、执行与交付\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">ABrain：业务知识与经确认的经验\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">权限、版本、审核和复用形成闭环\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">豆包也有任务与记忆能力；差别在企业知识和治理配置，非模型品牌高低\u003c/p>", "theme": "dark", "layout": "S08", "note": "比较通用豆包使用方式与拟配置的企业任务系统，不比较底层模型智力，不声称豆包不具备Agent或记忆能力。豆包官方帮助说明附件问答、任务模式和个性化记忆，功能以账号与版本为准。Agentify+ABrain按用户所述自我学习知识库定位展示方案机制，具体部署与功能需演示核验。\nhttps://lf9-cdn-tos.draftstatic.com/obj/ies-hotsoon-draft/grace_legal/doubao_member_copywrite_for_ai.html\n完整参考：../index.html#30"}, {"title": "个险机构负责人的个人知识库", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">个险机构负责人的个人知识库\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\n \u003cdiv data-anim=\"up\" style=\"display:flex;flex-direction:column;gap:1.5vh;margin-top:2vh\">\n \u003cdiv style=\"font-size:max(18px,1.45vw);font-weight:500\">起步任务：每周经营复盘与主管带教　　先选公司批准的存储与访问方式\u003c/div>\n \u003cdiv style=\"display:grid;grid-template-columns:11vw 1fr;gap:2vw;border-top:2px solid var(--accent);padding-top:1.8vh\">\n \u003cdiv style=\"font-size:1.6vw\">01 收资料\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:2vw;font-size:max(18px,1.3vw);line-height:1.5\">\u003cdiv>正式制度\u003cbr>\u003csmall style=\"font-size:max(16px,1.12vw);font-weight:500\">基本法、晋升、审批口径\u003c/small>\u003c/div>\u003cdiv>经营资料\u003cbr>\u003csmall style=\"font-size:max(16px,1.12vw);font-weight:500\">获准汇总表、周报模板\u003c/small>\u003c/div>\u003cdiv>管理经验\u003cbr>\u003csmall style=\"font-size:max(16px,1.12vw);font-weight:500\">白板会议、脱敏辅导案例\u003c/small>\u003c/div>\u003cdiv>外部参考\u003cbr>\u003csmall style=\"font-size:max(16px,1.12vw);font-weight:500\">Exa公开案例、来源链接\u003c/small>\u003c/div>\u003c/div>\u003c/div>\n \u003cdiv style=\"display:grid;grid-template-columns:11vw 1fr;gap:2vw;border-top:1px solid var(--grey-2);padding-top:1.8vh\">\u003cdiv style=\"font-size:1.6vw\">02 整理\u003c/div>\u003cdiv style=\"font-size:max(18px,1.35vw);line-height:1.6\">权限核对 → 脱敏与去重 → 提取正文/表格 → 按任务拆成知识条目 → 补来源与审核状态\u003c/div>\u003c/div>\n \u003cdiv style=\"display:grid;grid-template-columns:11vw 1fr;gap:2vw;border-top:1px solid var(--grey-2);padding-top:1.8vh\">\u003cdiv style=\"font-size:1.6vw\">03 建索引\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;font-size:max(18px,1.3vw);line-height:1.5\">\u003cdiv>任务目录 / Wiki\u003cbr>\u003csmall style=\"font-size:max(16px,1.12vw);font-weight:500\">经营复盘、招募、晋升、带教\u003c/small>\u003c/div>\u003cdiv>关系索引 / Ontology\u003cbr>\u003csmall style=\"font-size:max(16px,1.12vw);font-weight:500\">岗位—指标—制度—动作—案例\u003c/small>\u003c/div>\u003cdiv>证据卡 / ABrain方案\u003cbr>\u003csmall style=\"font-size:max(16px,1.12vw);font-weight:500\">ID、版本、定位、权限、责任人\u003c/small>\u003c/div>\u003c/div>\u003c/div>\n \u003cdiv style=\"display:grid;grid-template-columns:11vw 1fr;gap:2vw;border-top:1px solid var(--grey-2);padding-top:1.8vh\">\u003cdiv style=\"font-size:1.6vw\">04 使用\u003c/div>\u003cdiv style=\"font-size:max(18px,1.35vw);line-height:1.6\">真实问题 → 按权限和有效期检索 → Agent带出处回答 → 经理复核 → 带教/汇报/行动\u003c/div>\u003c/div>\n \u003cdiv style=\"display:grid;grid-template-columns:11vw 1fr;gap:2vw;background:var(--accent);color:white;padding:1.8vh 1vw\">\u003cdiv style=\"font-size:1.6vw\">05 更新 ↺\u003c/div>\u003cdiv style=\"font-size:max(18px,1.3vw);line-height:1.6\">采用反馈/发现错误 → 更新提议 → 负责人审核 → 新版本入库 → 固定题复测\u003cbr>\u003cspan style=\"font-size:max(16px,1.12vw)\">待复核内容隔离；过期版本归档；个人经验升级为团队知识须再次审批\u003c/span>\u003c/div>\u003c/div>\n \u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">知识库按用途组织；正式依据、待复核草案、个人记忆和外部参考分层管理\u003c/p>", "theme": "light", "layout": "S17", "note": "教学搭建示意，未替经理上传公司数据或创建实际ABrain实例。优先利用已获准企业空间。任务目录存用途；关系索引连接岗位、指标、制度与动作；原始证据保留页码、表格坐标及版本。客户信息与个人绩效资料不进入公开示例。来源标签见个险本地角色及共享内核。\n完整参考：../index.html#34"}, {"title": "自己的Agent：先选一个真实任务", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">自己的Agent：先选一个真实任务\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv class=\"timeline-h\" data-anim=\"up\" style=\"flex:0 0 35vh\">\u003cdiv class=\"tl-row\" style=\"grid-template-columns:repeat(6,1fr)\">\u003cdiv class=\"th-node up\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:13.666666666666666vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">01 定任务\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">选一个场景\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">例：主管带教\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"th-node down\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:13.666666666666666vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">02 写角色\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">定义提示词\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">对象、步骤、边界\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"th-node up\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:13.666666666666666vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">03 接资料\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">选择知识库\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">版本与访问范围\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"th-node down\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:13.666666666666666vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">04 接工具\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">授权搜索/文件\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">密钥放后台\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"th-node up\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:13.666666666666666vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">05 配方法\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">设置Skills\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">先问清，再取舍\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"th-node down\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:13.666666666666666vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">06 测试发布\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">用真实题验收\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">限范围试用\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">提示词是工作约定；模型、知识库、工具与权限必须在平台中实际配置\u003c/p>", "theme": "dark", "layout": "S11", "note": "这是平台无关的创建流程，不虚构Agentify界面按钮。管理员配置工具接口、凭证、访问控制和发布范围；业务经理定义任务、规则及验收。提示词/知识库/工具版本一起记录。\n完整参考：../index.html#35"}, {"title": "搜索工具与Skills：各自负责什么", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">搜索工具与Skills：各自负责什么\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv class=\"stack-row\" data-anim=\"up\" style=\"flex:0 0 39vh;margin-top:0\">\u003cdiv class=\"stack-block card-fill\" style=\"background:var(--grey-1);color:var(--ink);gap:2.4vh\">\u003cspan class=\"layer-nb\">01\u003c/span>\u003cdiv style=\"font-size:min(2.6vw,4.628vh);font-weight:300;line-height:1.22\">Exa 搜索工具\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">帮你去外面找资料\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">输入通用问题；取回网页正文与出处\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">查公开做法，不能替代内部制度\u003c/p>\u003c/div>\u003cdiv class=\"stack-block card-fill\" style=\"background:var(--grey-1);color:var(--ink);gap:2.4vh\">\u003cspan class=\"layer-nb\">02\u003c/span>\u003cdiv style=\"font-size:min(2.6vw,4.628vh);font-weight:300;line-height:1.22\">Office Hours\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">像同事陪你把问题问清楚\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">先问实际经历和证据，一次一个问题\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">输出：清晰问题与待验证假设\u003c/p>\u003c/div>\u003cdiv class=\"stack-block card-fill\" style=\"background:var(--grey-1);color:var(--ink);gap:2.4vh\">\u003cspan class=\"layer-nb\">03\u003c/span>\u003cdiv style=\"font-size:min(2.6vw,4.628vh);font-weight:300;line-height:1.22\">CEO Review\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">像经营会上一起做取舍\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">比路径、看风险，明确做与不做\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">输出：建议、小试验与决策请求\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">工具让Agent能查资料；Skills规定如何思考与推进任务\u003c/p>", "theme": "light", "layout": "S05", "note": "参考本地Office Hours与plan-ceo-review方法，转换为保险经理教学语言，不宣称个险Agent已安装完整gstack技能包。Office Hours先核实真实问题、挑战假设；CEO Review比较路径、控制范围、明确风险与决策。\nExa是外部检索API；Skills是可复用工作方法，不能代替工具授权。检索结果须核验，URL不保证结论正确。\nhttps://exa.ai/docs/reference/search\n完整参考：../index.html#37"}, {"title": "个险Agent：六项工作约定", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">个险Agent：六项工作约定\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;border-top:2px solid var(--accent);padding-top:4vh\">\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">角色与对象\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">服务谁\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">机构负责人带教助手\u003cbr>聚焦一个实际课题\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">资料与工具\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">用什么\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">获准知识、公开搜索、文件工具\u003cbr>明确来源与权限\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">流程与验收\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">怎样做\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">先问清，再比较与交付\u003cbr>无依据说明，关键决定请人确认\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);line-height:1.5\">\u003ca href=\"agent-reference.html#onepage\">打开完整六项提示词 ↗\u003c/a>　\u003ca href=\"references.html#20\">九项约定与长版参考 ↗\u003c/a>\u003c/p>", "theme": "light", "layout": "S05", "note": "六项是角色、对象、资料、工具、流程、验收与边界的课堂归纳；完整教学提示词保留在附件，不逐字读。提示词不是工具权限，连接系统须实际配置。原第39页完整六块文字和第40页九章参考均保留。\n完整参考：../index.html#39"}, {"title": "发布前：自测与独立验收", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">发布前：自测与独立验收\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv class=\"duo-compare\" data-anim=\"up\" style=\"margin-top:0;flex:0 0 auto;min-height:38vh\">\u003cdiv class=\"col\" data-anim=\"left\">\u003cspan class=\"t-cat\" style=\"color:inherit\">第一套 · 创建者\u003c/span>\u003cdiv style=\"font-size:min(3.6vw,6.408vh);font-weight:300;line-height:1.22\">自测与修订\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:2.5vh;margin-top:2vh\">\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">已知问题、资料冲突、工具失效、越权诱导\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">保存输入、回答、依据、错误与版本\u003c/p>\u003c/div>\u003c/div>\u003cspan class=\"vrule\">\u003c/span>\u003cdiv class=\"col\" data-anim=\"right\">\u003cspan class=\"t-cat\" style=\"color:inherit\">第二套 · 机构负责人\u003c/span>\u003cdiv style=\"font-size:min(3.6vw,6.408vh);font-weight:300;line-height:1.22\">独立业务题\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:2.5vh;margin-top:2vh\">\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">先约定任务与标准，再用独立业务题\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">核验依据、可执行性与边界，反馈结果后复测\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp style=\"font-size:19px;line-height:1.65;border-top:2px solid var(--accent);padding-top:18px\">固定答案可辅助自动核对；开放答案由业务人员评估。\u003cbr>关键错误未解决，不扩大发布；通过后仍按授权限范围试用。\u003c/p>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">此处是Agent试用验收，非本项目正式打分规则；正式评分以项目组表单为准。\u003c/p>", "theme": "light", "layout": "S08", "note": "借鉴来源第29页两套测试集。\nhttps://kvbp4ddagl8.feishu.cn/slides/O6P6s2m5rlCCyjdXnwjcyL7tnHd\n这是建议训练与验收流程，不是现有学员通过率。双方先确认真实任务范围与评分标准。独立题不提前用于调试，后续换等价新题避免记题。涉及产品、对客话术等内容须授权专业人员参与评估。\n完整参考：../index.html#42"}, {"title": "从用户到架构师", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">从用户到架构师\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px\">\u003cdiv style=\"position:relative;border-top:3px solid var(--accent);padding-top:22px\">\u003cspan style=\"font-size:17px;color:inherit;opacity:.6\">01\u003c/span>\u003ch3 style=\"font-size:29px;font-weight:400;margin:14px 0 18px\">会用\u003c/h3>\u003cp style=\"font-size:20px;line-height:1.65\">拿真实任务提问\u003cbr>补背景、查来源、纠偏\u003c/p>\u003cdiv style=\"margin-top:22px;padding-top:14px;border-top:1px solid #999;font-size:17px;line-height:1.6\">产物：一段经过核验的好用法\u003c/div>\u003cspan style=\"position:absolute;right:-22px;top:65px;font-size:25px;color:var(--accent)\">→\u003c/span>\u003c/div>\u003cdiv style=\"position:relative;border-top:3px solid var(--accent);padding-top:22px\">\u003cspan style=\"font-size:17px;color:inherit;opacity:.6\">02\u003c/span>\u003ch3 style=\"font-size:29px;font-weight:400;margin:14px 0 18px\">会定义\u003c/h3>\u003cp style=\"font-size:20px;line-height:1.65\">明确服务谁、解决什么\u003cbr>规定输入、输出和边界\u003c/p>\u003cdiv style=\"margin-top:22px;padding-top:14px;border-top:1px solid #999;font-size:17px;line-height:1.6\">产物：一张Agent任务卡\u003c/div>\u003cspan style=\"position:absolute;right:-22px;top:65px;font-size:25px;color:var(--accent)\">→\u003c/span>\u003c/div>\u003cdiv style=\"position:relative;border-top:3px solid var(--accent);padding-top:22px\">\u003cspan style=\"font-size:17px;color:inherit;opacity:.6\">03\u003c/span>\u003ch3 style=\"font-size:29px;font-weight:400;margin:14px 0 18px\">会构建\u003c/h3>\u003cp style=\"font-size:20px;line-height:1.65\">写提示词，接获准知识\u003cbr>配置工具与工作方法\u003c/p>\u003cdiv style=\"margin-top:22px;padding-top:14px;border-top:1px solid #999;font-size:17px;line-height:1.6\">产物：自己的场景Agent\u003c/div>\u003cspan style=\"position:absolute;right:-22px;top:65px;font-size:25px;color:var(--accent)\">→\u003c/span>\u003c/div>\u003cdiv style=\"position:relative;border-top:3px solid var(--accent);padding-top:22px\">\u003cspan style=\"font-size:17px;color:inherit;opacity:.6\">04\u003c/span>\u003ch3 style=\"font-size:29px;font-weight:400;margin:14px 0 18px\">会改进\u003c/h3>\u003cp style=\"font-size:20px;line-height:1.65\">用真实问题测试\u003cbr>记录错误、修订与复测\u003c/p>\u003cdiv style=\"margin-top:22px;padding-top:14px;border-top:1px solid #999;font-size:17px;line-height:1.6\">产物：有版本的可复用Agent\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"margin-top:18px;border-top:2px solid var(--accent);padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:35px;font-size:18px;line-height:1.6\">\u003cdiv>机构负责人负责：业务目标、规则与验收\u003cbr>技术/管理员协助：接口、权限与发布\u003c/div>\u003cdiv>自选练习：把一次主管带教任务做成Agent\u003cbr>验收：能找依据、会问关键问题、不越权\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">已有的好用法，是搭建Agent的输入；下一步把它写成可重复执行的规则\u003c/p>", "theme": "dark", "layout": "S19", "note": "由观察到的补背景、纠偏、追问和交付要求，引出可设计的角色与规则。此页是训练路径，不声称学员已经完成独立搭建。经理成为任务设计者与验收者，不要求成为程序员。\n完整参考：../index.html#43"}, {"title": "从个人到团队管理", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">从个人到团队管理\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px\">\u003cdiv style=\"position:relative;border-top:3px solid var(--accent);padding-top:22px\">\u003cspan style=\"font-size:17px;color:inherit;opacity:.6\">01\u003c/span>\u003ch3 style=\"font-size:29px;font-weight:400;margin:14px 0 18px\">自己先跑通\u003c/h3>\u003cp style=\"font-size:20px;line-height:1.65\">经理先构建并使用Agent\u003cbr>保留失败与修订过程\u003c/p>\u003cdiv style=\"margin-top:22px;padding-top:14px;border-top:1px solid #999;font-size:17px;line-height:1.6\">经理角色：示范者\u003c/div>\u003cspan style=\"position:absolute;right:-22px;top:65px;font-size:25px;color:var(--accent)\">→\u003c/span>\u003c/div>\u003cdiv style=\"position:relative;border-top:3px solid var(--accent);padding-top:22px\">\u003cspan style=\"font-size:17px;color:inherit;opacity:.6\">02\u003c/span>\u003ch3 style=\"font-size:29px;font-weight:400;margin:14px 0 18px\">带代理人共创\u003c/h3>\u003cp style=\"font-size:20px;line-height:1.65\">从代理人的真实需求入手\u003cbr>有意愿者选一个真实任务\u003c/p>\u003cdiv style=\"margin-top:22px;padding-top:14px;border-top:1px solid #999;font-size:17px;line-height:1.6\">经理角色：提问与带教者\u003c/div>\u003cspan style=\"position:absolute;right:-22px;top:65px;font-size:25px;color:var(--accent)\">→\u003c/span>\u003c/div>\u003cdiv style=\"position:relative;border-top:3px solid var(--accent);padding-top:22px\">\u003cspan style=\"font-size:17px;color:inherit;opacity:.6\">03\u003c/span>\u003ch3 style=\"font-size:29px;font-weight:400;margin:14px 0 18px\">支持代理人动手\u003c/h3>\u003cp style=\"font-size:20px;line-height:1.65\">代理人写规则、接获准资料\u003cbr>互相扮演客户测试和纠偏\u003c/p>\u003cdiv style=\"margin-top:22px;padding-top:14px;border-top:1px solid #999;font-size:17px;line-height:1.6\">经理角色：组织练习与验收\u003c/div>\u003cspan style=\"position:absolute;right:-22px;top:65px;font-size:25px;color:var(--accent)\">→\u003c/span>\u003c/div>\u003cdiv style=\"position:relative;border-top:3px solid var(--accent);padding-top:22px\">\u003cspan style=\"font-size:17px;color:inherit;opacity:.6\">04\u003c/span>\u003ch3 style=\"font-size:29px;font-weight:400;margin:14px 0 18px\">形成团队资产\u003c/h3>\u003cp style=\"font-size:20px;line-height:1.65\">个人试用 → 同伴互测\u003cbr>授权审核 → 团队发布\u003c/p>\u003cdiv style=\"margin-top:22px;padding-top:14px;border-top:1px solid #999;font-size:17px;line-height:1.6\">明确维护人、版本、反馈入口\u003c/div>\u003c/div>\u003c/div>\u003cdiv style=\"margin-top:18px;border-top:2px solid var(--accent);padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:35px;font-size:18px;line-height:1.6\">\u003cdiv>需求入口：营销图文/视频草稿、客户跟进、异议练习\u003cbr>个人自建默认限自己；团队发布须授权，接企微另审批\u003c/div>\u003cdiv>验收重点：代理人能解释依据、修改规则、修复错误\u003cbr>评价真实采用与复用，不以Agent数量替代效果\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">个人能力通过示范、共创、互测和审核，转化为团队可持续维护的能力\u003c/p>", "theme": "hero light", "layout": "S19", "note": "主题为辅导机构负责人培训代理人构建和改进自己的Agent，不是让经理独自替全员搭建，也不直接授权开放客户信息或自动群发。现场可用脱敏异议练习：经理示范一次，代理人各改一处提示词，交换测试，讲清改动理由。\n借鉴来源第24页个人自建与企业统建。个人不能自行扩大知识访问权限，机构负责人业务确认不替代管理员与合规授权。\nhttps://kvbp4ddagl8.feishu.cn/slides/O6P6s2m5rlCCyjdXnwjcyL7tnHd\n完整参考：../index.html#44"}, {"title": "一次客户异议，如何成为团队知识", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">一次客户异议，如何成为团队知识\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cp style=\"font-size:20px\">教学示例：客户说“已经买过保险了”\u003c/p>\u003cdiv class=\"timeline-h\" data-anim=\"up\" style=\"flex:0 0 35vh\">\u003cdiv class=\"tl-row\" style=\"grid-template-columns:repeat(5,1fr)\">\u003cdiv class=\"th-node up\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:16.4vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">代理人\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">脱敏记录\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">原话＋情境\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"th-node down\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:16.4vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">Agent辅助\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">整理经验\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">回应＋待核问题\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"th-node up\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:16.4vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">授权负责人\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">核验与审核\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">依据＋适用条件\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"th-node down\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:16.4vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">知识维护人\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">版本入库\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">来源＋权限＋有效期\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"th-node up\">\u003cspan class=\"dot\" style=\"border-radius:0;background:currentColor\">\u003c/span>\u003cdiv class=\"label\" style=\"width:16.4vw\">\u003cspan class=\"yr\" style=\"font-size:max(16px,1.2vw);color:inherit\">团队使用者\u003c/span>\u003cspan class=\"name\" style=\"color:inherit;font-size:min(2.2vw,3.92vh);font-weight:400\">陪练与反馈\u003c/span>\u003cspan class=\"desc\" style=\"color:inherit;font-size:max(16px,1.08vw)\">记录错误与修订\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;font-size:19px;line-height:1.6;border-top:1px solid var(--grey-2);padding-top:18px\">\u003cdiv>\u003cb>个人草稿\u003c/b>\u003cbr>自己复盘，待核验内容隔离\u003c/div>\u003cdiv>\u003cb>团队素材\u003c/b>\u003cbr>审核后限范围陪练，不直接对客\u003c/div>\u003cdiv>\u003cb>企业知识\u003c/b>\u003cbr>授权部门审批，明确维护人与版本\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">一次成功经验是候选案例；审核、适用条件与复测齐备后，才可扩大复用\u003c/p>", "theme": "light", "layout": "S11", "note": "借鉴来源第15页。\nhttps://kvbp4ddagl8.feishu.cn/slides/O6P6s2m5rlCCyjdXnwjcyL7tnHd\n本页为教学示例，非新增真实学员案例。经验贡献须获授权并脱敏。一次成功不证明可泛化，需保留适用条件与反例。产品与对客话术须由有权部门审核。团队反馈重新进入整理、核验和版本更新，不能自动覆盖有效制度。\n完整参考：../index.html#45"}, {"title": "路径一：带代理人创建陪练Agent", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">路径一：带代理人创建陪练Agent\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv data-anim=\"up\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:3vw;border-top:2px solid var(--accent);padding-top:4vh\">\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">01\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">选任务\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">从真实客户问题中\u003cbr>选择一个练习场景\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">02\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">看示范\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">AI扮客户\u003cbr>回应后看反馈\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">03\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">自己创建\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">填角色、资料与流程\u003cbr>明确边界\u003c/p>\u003c/div>\u003cdiv data-anim=\"step\" style=\"display:flex;flex-direction:column;gap:2.4vh\">\u003cspan class=\"t-meta\">04\u003c/span>\u003cdiv style=\"font-size:min(2.65vw,4.72vh);font-weight:300;line-height:1.25\">互测改进\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.6\">同伴试用\u003cbr>改一条规则再测\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);line-height:1.5\">自愿共创，用脱敏情境起步。 \u003ca href=\"../index.html#46\">70分钟实操步骤与六项提示词 ↗\u003c/a>\u003c/p>", "theme": "light", "layout": "S19", "note": "建议教学路径，尚未实施；70分钟是独立实操课，不是在60分钟总结会上额外加70分钟。先用脱敏案例，不接真实客户系统。机构负责人先示范失败与修订，再让代理人自己创建、互测；技术管理员负责平台权限和知识接入。\n可复制的六项起步提示词：\n角色：保险销售陪练，不直接服务真实客户。\n对象：练习需求澄清与异议回应的代理人。\n资料：只用公司批准的产品材料和服务规范；无依据就说明。\n流程：先问情景，再扮客户；每次一轮，等待代理人回应，结束后才点评。\n反馈：从需求澄清、事实准确、表达清楚、下一步确认四方面，引用原回答，给一个优点和一个优先改进点。\n边界：不编造保障、收益或核保结论；不确定时查正式资料或请授权人员确认。\n任务选择参考来源第27页现场四问：最烦、重复、易错、现在怎么完成。选一次具体经历，移除客户身份信息，再填写任务卡。\nhttps://kvbp4ddagl8.feishu.cn/slides/O6P6s2m5rlCCyjdXnwjcyL7tnHd\n完整参考：../index.html#46"}, {"title": "路径二：用Agent辅助团队带教", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">路径二：用Agent辅助团队带教\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2vh\">\n \u003cp style=\"font-size:20px;line-height:1.5\">个人复盘 → Agent整理 → 负责人确认 → 针对性练习 → 下周回看 ↺\u003c/p>\n \u003cdiv data-anim=\"up\" style=\"font-size:18px;line-height:1.5\">\u003cdiv style=\"display:grid;grid-template-columns:0.7fr 1.7fr 1.8fr 2fr;gap:18px;background:var(--ink);color:var(--paper);padding:12px 16px\">\u003cdiv>节奏\u003c/div>\u003cdiv>代理人：提供事实并行动\u003c/div>\u003cdiv>Agent：整理与辅助\u003c/div>\u003cdiv>机构负责人：判断与带教\u003c/div>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:0.7fr 1.7fr 1.8fr 2fr;gap:18px;padding:9px 16px;border-bottom:1px solid var(--grey-2)\">\u003cdiv style=\"color:var(--accent);font-weight:500\">周会前\u003c/div>\u003cdiv style=\"\">提交目标、动作、卡点、所需支持\u003c/div>\u003cdiv style=\"\">汇总共性问题\u003cbr>标记缺失信息与依据\u003c/div>\u003cdiv style=\"\">核实原因\u003cbr>选一个本周重点\u003c/div>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:0.7fr 1.7fr 1.8fr 2fr;gap:18px;padding:9px 16px;border-bottom:1px solid var(--grey-2)\">\u003cdiv style=\"color:var(--accent);font-weight:500\">周会中\u003c/div>\u003cdiv style=\"\">讲一个具体过程\u003cbr>不只报数字\u003c/div>\u003cdiv style=\"\">提供追问、案例\u003cbr>生成针对性练习情景\u003c/div>\u003cdiv style=\"\">判断技能／资源／流程问题\u003cbr>不把困难直接归因个人\u003c/div>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:0.7fr 1.7fr 1.8fr 2fr;gap:18px;padding:9px 16px;border-bottom:1px solid var(--grey-2)\">\u003cdiv style=\"color:var(--accent);font-weight:500\">周会后\u003c/div>\u003cdiv style=\"\">完成一次练习\u003cbr>或真实业务行动\u003c/div>\u003cdiv style=\"\">辅助生成个人行动卡\u003cbr>任务、支持、复盘点\u003c/div>\u003cdiv style=\"\">确认负责人、支持资源\u003cbr>与复盘时间\u003c/div>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:0.7fr 1.7fr 1.8fr 2fr;gap:18px;padding:9px 16px;border-bottom:1px solid var(--grey-2)\">\u003cdiv style=\"color:var(--accent);font-weight:500\">下次周会\u003c/div>\u003cdiv style=\"\">反馈实际执行\u003cbr>及结果证据\u003c/div>\u003cdiv style=\"\">对照上次行动\u003cbr>整理变化和未解决项\u003c/div>\u003cdiv style=\"\">决定继续／调整／停止\u003cbr>审核有效经验后复用\u003c/div>\u003c/div>\u003c/div>\n \u003cp style=\"font-size:18px\">\u003ca href=\"../index.html#48\">查看完整带教情境与可选试验 ↗\u003c/a>\u003c/p>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">按团队意愿选任务，不要求人人使用AI；不自动考核、不自动群发，接系统须审批。\u003c/p>", "theme": "hero light", "layout": "S17", "note": "试点为建议，不是已执行事实。选择3–5位自愿参与者，先记录基线，运行两周后比较实际任务、反馈采用、错误复发、负责人审核和准备耗时；不以Agent数量替代效果。实际数据按公司权限最小化访问，个人带教反馈不公开排名。不自动群发、不上传可识别客户资料。AI提出待核实问题与行动建议，机构负责人决定资源、带教和业务行动；聊天频率或AI分数不能直接作为能力、绩效、晋升依据。\n完整参考：../index.html#48"}, {"title": "合规护栏：材料入口与输出出口", "body": "\u003ch2 data-anim=\"head\" style=\"font-size:min(4vw,7.12vh);font-weight:300;line-height:1.15;letter-spacing:-.025em\">合规护栏：材料入口与输出出口\u003c/h2>\u003cdiv style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3vh\">\u003cdiv class=\"duo-compare\" data-anim=\"up\" style=\"margin-top:0;flex:0 0 auto;min-height:38vh\">\u003cdiv class=\"col\" data-anim=\"left\">\u003cspan class=\"t-cat\" style=\"color:inherit\">入口 · 不进入本方案资料库\u003c/span>\u003cdiv style=\"font-size:min(3.6vw,6.408vh);font-weight:300;line-height:1.22\">敏感与未核验材料\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:2.5vh;margin-top:2vh\">\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">客户个人信息、未审批宣传材料\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">不明来源、不可追溯版本\u003c/p>\u003c/div>\u003c/div>\u003cspan class=\"vrule\">\u003c/span>\u003cdiv class=\"col\" data-anim=\"right\">\u003cspan class=\"t-cat\" style=\"color:inherit\">出口 · 人工审核\u003c/span>\u003cdiv style=\"font-size:min(3.6vw,6.408vh);font-weight:300;line-height:1.22\">可追溯、可标记、可控权\u003c/div>\u003cdiv style=\"display:flex;flex-direction:column;gap:2.5vh;margin-top:2vh\">\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">每条对客口径对应正式文件\u003c/p>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">未审核不对客，分层授权\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cp data-anim=\"up\" style=\"font-size:max(16px,1.05vw);font-weight:500;line-height:1.5;color:inherit;opacity:.78\">建议交中宏合规部书面确认；AI生成默认标注“未经审核，不得直接对客使用”\u003c/p>", "theme": "light", "layout": "S08", "note": "内部方案建议，不是法律结论。未经审批收益演示、竞品贬损表述不纳入。个人库、团队库升级须审核。具体客户信息处理、保留期限、权限和宣传规则由中宏合规部书面确认。\n完整参考：../index.html#50"}, {"title": "现场交流：好行为怎样变成业务价值", "body": "\u003cdiv class=\"split-half\">\u003cdiv class=\"half b-accent\" style=\"justify-content:space-between;padding-bottom:9vh;position:relative;overflow:hidden\">\u003ccanvas class=\"ascii-bg\" aria-hidden=\"true\">\u003c/canvas>\u003cdiv class=\"chrome-min\" style=\"color:white\">现场交流 · 5分钟\u003c/div>\u003ch2 data-anim=\"manifesto\" style=\"font-size:min(5.1vw,9.08vh);font-weight:200;line-height:1.3;position:relative\">结合自己的课题\u003cbr>选择适合的\u003cbr>\u003cspan style=\"font-style:italic;font-weight:300\">AI用法\u003c/span>\u003c/h2>\u003cp data-anim=\"signature\" style=\"font-size:max(18px,1.4vw);position:relative\">自愿探索，分享真实过程\u003cbr>保留人的判断、关系与领导力\u003c/p>\u003c/div>\u003cdiv class=\"half\" style=\"justify-content:center;gap:5vh;padding-bottom:9vh\">\u003cdiv data-anim=\"rules\" style=\"display:flex;gap:2vw;border-top:1px solid var(--grey-2);padding-top:3vh;\">\u003cspan style=\"font-size:min(4.3vw,7.66vh);font-weight:200\">01\u003c/span>\u003cdiv>\u003cdiv style=\"font-size:min(2.8vw,4.984vh);font-weight:300;line-height:1.22\">体验\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">个人：哪个任务值得尝试？\u003c/p>\u003c/div>\u003c/div>\u003cdiv data-anim=\"rules\" style=\"display:flex;gap:2vw;border-top:1px solid var(--grey-2);padding-top:3vh;\">\u003cspan style=\"font-size:min(4.3vw,7.66vh);font-weight:200\">02\u003c/span>\u003cdiv>\u003cdiv style=\"font-size:min(2.8vw,4.984vh);font-weight:300;line-height:1.22\">任务\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">团队：怎样互相学习与支持？\u003c/p>\u003c/div>\u003c/div>\u003cdiv data-anim=\"rules\" style=\"display:flex;gap:2vw;border-top:1px solid var(--grey-2);padding-top:3vh;color:var(--accent)\">\u003cspan style=\"font-size:min(4.3vw,7.66vh);font-weight:200\">03\u003c/span>\u003cdiv>\u003cdiv style=\"font-size:min(2.8vw,4.984vh);font-weight:300;line-height:1.22\">价值\u003c/div>\u003cp style=\"font-size:max(18px,1.4vw);line-height:1.55\">组织：需要什么资料、权限与协同？\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>", "theme": "split light", "layout": "SWISS-CLOSING-ASCII", "note": "交流5分钟，从个人、团队、组织三个层面联系自身行动学习课题。可选择不用AI，不强制每组提交AI提案，不以使用频次或Agent数量评价学员。正式打分由项目组表单决定。结束后预留5分钟休息，由主持人衔接后续环节。\n完整参考：../index.html#54"}];const styles="\u003cstyle>\n  :root{\n    /* ============ 主题色(默认: 🔵 克莱因蓝 IKB) ============\n       切换主题: 从 references/themes-swiss.md 复制对应的 :root 块\n       整体替换标有\"主题色\"注释的所有变量,其他散落的 var() 引用无需逐处改 */\n    --paper:#fafaf8;          /* 主底色: 高级灰白 */\n    --paper-rgb:250,250,248;\n    --ink:#0a0a0a;            /* 文字主色: 近黑 */\n    --ink-rgb:10,10,10;\n    --grey-1:#f0f0ee;         /* 浅灰底 */\n    --grey-2:#d4d4d2;         /* 中灰(分割线) */\n    --grey-3:#737373;         /* 暗灰(辅助文字) */\n    --accent:#002FA7;         /* 高亮色: 克莱因蓝 IKB */\n    --accent-rgb:0,47,167;\n    --accent-on:#ffffff;      /* accent 上的反色文字 */\n    --accent-bright:#5B7BFF;  /* 暗底高亮: IKB 提亮版 */\n\n    /* ============ Carbon 文本角色 t
